<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Johanna ❤️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --color-paper: #fcf7f0;
            --color-paper-dark: #f5ede1;
            --color-gold: #c9a87c;
            --color-gold-light: #e4d0b0;
            --color-brown: #7a4e2a;
            --color-brown-dark: #553b22;
            --color-brown-light: #a67a4a;
            --color-ivory: #fefcf8;
            --color-sunset: #e87a4a;
            --color-twilight: #2c1e16;
            --color-bloom: #d45a4a;
            --color-cherry: #b8413a;
            --color-tulip: #d45a4a;
            --color-sky: #6a8fa0;
            --color-shadow: rgba(44, 30, 22, 0.25);
            --mobile-header-height: 60px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: var(--color-twilight);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Crimson Text', 'Georgia', serif;
            background: radial-gradient(ellipse at 20% 30%, #3f2a1e, #1f1610);
            position: relative;
            transition: padding 0.3s ease;
        }

        body.mobile-view {
            padding: 5px;
            display: block;
        }

        body.mobile-view .book-container {
            width: 100%;
            height: calc(100vh - 10px);
            margin: 0 auto;
            max-width: 100%;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        body.mobile-view .book-content {
            border-radius: 8px;
        }

        body.mobile-view .page {
            width: 100%;
            padding: 15px;
        }

        body.mobile-view .page-left,
        body.mobile-view .page-right {
            display: none;
        }

        body.mobile-view .single-page {
            display: block !important;
            padding: 60px 20px 70px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }

        body.mobile-view .single-page.scene-page .scene-image-container {
            margin: 25px auto;
            max-width: 95%;
            padding: 15px;
        }

        body.mobile-view .scene-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
        }

        body.mobile-view .scene-text {
            font-size: 1rem;
            line-height: 1.7;
            text-indent: 1.5em;
            margin-bottom: 25px;
        }

        body.mobile-view .scene-text::first-letter {
            font-size: 2.2rem;
        }

        body.mobile-view .cover-title {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        body.mobile-view .cover-subtitle {
            font-size: 1rem;
            padding: 12px;
            margin-bottom: 25px;
        }

        body.mobile-view .cover-author {
            font-size: 0.9rem;
            padding: 10px 20px;
        }

        body.mobile-view .end-title {
            font-size: 3.5rem;
            letter-spacing: 3px;
        }

        body.mobile-view .book-spine {
            display: none;
        }

        body.mobile-view .book-content::after {
            display: none;
        }

        body.mobile-view .page-number {
            position: fixed;
            bottom: 55px;
            background: rgba(122, 78, 42, 0.15);
            padding: 4px 12px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            border: 1px solid rgba(201, 167, 105, 0.2);
        }

        body.mobile-view .page-number.mobile-left {
            left: 15px;
            right: auto;
        }

        body.mobile-view .page-number.mobile-right {
            right: 15px;
            left: auto;
        }

        .mobile-controls {
            position: fixed;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: none;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(44, 30, 22, 0.92), rgba(85, 59, 34, 0.92));
            padding: 8px 15px;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1.5px solid var(--color-gold);
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        body.mobile-view .mobile-controls {
            display: flex;
        }

        .mobile-nav-btn {
            background: linear-gradient(135deg, var(--color-gold), var(--color-sunset));
            color: var(--color-ivory);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .mobile-nav-btn:active {
            transform: scale(0.92);
        }

        .mobile-page-indicator {
            color: var(--color-ivory);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 15px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            min-width: 100px;
            text-align: center;
            border: 1px solid rgba(201, 167, 105, 0.25);
        }

        .utility-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        body.mobile-view .utility-controls {
            top: 6px;
            right: 6px;
            gap: 5px;
        }

        .utility-btn {
            background: linear-gradient(135deg, rgba(44, 30, 22, 0.9), rgba(85, 59, 34, 0.9));
            color: var(--color-ivory);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 0 2px var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body.mobile-view .utility-btn {
            width: 30px;
            height: 30px;
            font-size: 0.8rem;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15), 0 0 0 1px var(--color-gold);
            background: linear-gradient(135deg, rgba(44, 30, 22, 0.85), rgba(85, 59, 34, 0.85));
        }

        .utility-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.15));
            border-radius: 50%;
            z-index: 1;
        }

        .utility-btn i {
            position: relative;
            z-index: 2;
        }

        .utility-btn:hover {
            background: linear-gradient(135deg, var(--color-brown-light), var(--color-sunset));
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 12px 35px rgba(232, 122, 74, 0.5), 0 0 0 2px var(--color-gold);
        }

        .utility-btn.active-audio {
            background: linear-gradient(135deg, var(--color-sunset), var(--color-bloom));
            animation: pulse-audio 1.5s infinite;
        }

        @keyframes pulse-audio {
            0%,
            100% {
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--color-gold), 0 0 0 0 rgba(232, 122, 74, 0.4);
            }
            50% {
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--color-gold), 0 0 0 8px rgba(232, 122, 74, 0);
            }
        }

        body.fullscreen-landscape {
            padding: 0;
            transform: rotate(0deg);
            overflow: hidden;
        }

        body.fullscreen-landscape .book-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            margin: 0;
            border-radius: 0;
        }

        body.fullscreen-landscape .utility-btn {
            width: 30px;
            height: 30px;
            font-size: 0.8rem;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 0 0 1px var(--color-gold);
        }

        body.fullscreen-landscape .utility-controls {
            top: 8px;
            right: 8px;
            gap: 6px;
        }

        body.fullscreen-landscape .book-content {
            border-radius: 0;
            box-shadow: none;
        }

        .orientation-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-twilight);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--color-gold);
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .orientation-notice i {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: rotate 2s ease-in-out infinite;
        }

        .orientation-notice p {
            font-size: 1.2rem;
            max-width: 250px;
            line-height: 1.5;
        }

        @keyframes rotate {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(90deg);
            }
        }

        .book-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 700px;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
            transition: all 0.3s ease;
        }

        .book-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 2000px;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .book-content {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--color-paper);
            border-radius: 8px 20px 20px 8px;
            box-shadow: -15px 0 40px rgba(0, 0, 0, 0.6), 0 25px 70px rgba(0, 0, 0, 0.5), inset 1px 0 0 rgba(255, 255, 255, 0.1);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(90, 55, 31, 0.3);
        }

        .book-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, transparent 50%, rgba(122, 78, 42, 0.03) 100%),
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 1px,
                    rgba(122, 78, 42, 0.03) 1px,
                    rgba(122, 78, 42, 0.03) 2px),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%237a4e2a' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .book-spine {
            position: absolute;
            left: -50px;
            top: 15px;
            bottom: 15px;
            width: 50px;
            background: linear-gradient(to right,
                    var(--color-brown-dark) 0%,
                    var(--color-brown) 20%,
                    var(--color-gold) 50%,
                    var(--color-brown) 80%,
                    var(--color-brown-dark) 100%);
            box-shadow: inset -5px 0 15px rgba(0, 0, 0, 0.8), 5px 0 20px rgba(0, 0, 0, 0.6);
            z-index: 10;
            border-radius: 5px 0 0 5px;
            border-left: 2px solid rgba(201, 167, 105, 0.3);
        }

        .spine-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            color: var(--color-ivory);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            white-space: nowrap;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(201, 167, 105, 0.3);
            font-family: 'Crimson Text', serif;
            text-transform: uppercase;
        }

        .spine-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 20%, rgba(201, 167, 105, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(201, 167, 105, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .book-content::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 30px;
            transform: translateX(-50%);
            background: linear-gradient(to right,
                    transparent,
                    rgba(0, 0, 0, 0.08) 5%,
                    rgba(0, 0, 0, 0.12) 50%,
                    rgba(0, 0, 0, 0.08) 95%,
                    transparent);
            z-index: 5;
            pointer-events: none;
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.1), inset 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .page {
            width: 50%;
            height: 100%;
            padding: 60px 50px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 2;
        }

        .single-page {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .page::-webkit-scrollbar {
            width: 8px;
        }

        .page::-webkit-scrollbar-track {
            background: rgba(122, 78, 42, 0.1);
            border-radius: 4px;
        }

        .page::-webkit-scrollbar-thumb {
            background: var(--color-gold);
            border-radius: 4px;
        }

        .page-left {
            background: var(--color-paper-dark);
            border-right: 1px solid rgba(122, 78, 42, 0.2);
            box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .page-right {
            background: var(--color-paper);
            box-shadow: inset 5px 0 10px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .cover-page {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                    #2c1e16 0%,
                    #5a3a28 30%,
                    #c9a87c 70%,
                    #b8413a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 60px;
            position: relative;
            overflow: hidden;
        }

        body.mobile-view .cover-page {
            padding: 40px 20px;
        }

        .cover-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 0, 0, 0.2) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M45 80c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32zm110 50c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32zM95 180c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32z' fill='%23ffffff' fill-opacity='0.06' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .cover-ornament {
            position: absolute;
            color: rgba(255, 255, 255, 0.12);
            font-size: 8rem;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        body.mobile-view .cover-ornament {
            font-size: 4rem;
        }

        .ornament-tl {
            top: 40px;
            left: 40px;
            animation: float 20s infinite linear;
        }

        .ornament-tr {
            top: 40px;
            right: 40px;
            animation: float 20s infinite linear reverse;
        }

        .ornament-bl {
            bottom: 40px;
            left: 40px;
            animation: float 25s infinite linear;
        }

        .ornament-br {
            bottom: 40px;
            right: 40px;
            animation: float 25s infinite linear reverse;
        }

        body.mobile-view .ornament-tl {
            top: 20px;
            left: 20px;
        }
        body.mobile-view .ornament-tr {
            top: 20px;
            right: 20px;
        }
        body.mobile-view .ornament-bl {
            bottom: 20px;
            left: 20px;
        }
        body.mobile-view .ornament-br {
            bottom: 20px;
            right: 20px;
        }

        @keyframes float {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .cover-title {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--color-ivory);
            margin-bottom: 30px;
            letter-spacing: 6px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7), 0 0 40px rgba(232, 122, 74, 0.4), 0 0 80px rgba(201, 167, 105, 0.3);
            z-index: 1;
            position: relative;
            font-family: 'Crimson Text', serif;
            line-height: 1.2;
            padding-bottom: 20px;
            border-bottom: 3px double rgba(255, 255, 255, 0.3);
        }

        body.mobile-view .cover-title {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .cover-title::after {
            content: '❤️';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--color-bloom);
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(212, 90, 74, 0.5);
        }

        body.mobile-view .cover-title::after {
            font-size: 1.2rem;
            bottom: -8px;
        }

        .cover-subtitle {
            font-size: 1.8rem;
            font-style: italic;
            color: var(--color-gold-light);
            margin-bottom: 50px;
            max-width: 700px;
            line-height: 1.6;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
            z-index: 1;
            position: relative;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(201, 167, 105, 0.3);
            backdrop-filter: blur(5px);
        }

        body.mobile-view .cover-subtitle {
            font-size: 1rem;
            padding: 12px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .cover-author {
            font-size: 1.5rem;
            color: var(--color-gold-light);
            padding: 20px 40px;
            border-top: 2px solid rgba(201, 167, 105, 0.4);
            z-index: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-top: 30px;
            letter-spacing: 2px;
        }

        body.mobile-view .cover-author {
            font-size: 0.9rem;
            padding: 10px 20px;
            margin-top: 20px;
        }

        .scene-title {
            font-size: 2.8rem;
            color: var(--color-brown-dark);
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 4px double var(--color-gold);
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-family: 'Crimson Text', serif;
        }

        .scene-title::before,
        .scene-title::after {
            content: '✦';
            position: absolute;
            bottom: -15px;
            color: var(--color-gold);
            font-size: 1.5rem;
            opacity: 0.7;
        }

        .scene-title::before {
            left: 0;
        }
        .scene-title::after {
            right: 0;
        }

        body.mobile-view .scene-title::before,
        body.mobile-view .scene-title::after {
            font-size: 1rem;
            bottom: -10px;
        }

        .scene-text {
            font-size: 1.45rem;
            line-height: 2.1;
            color: var(--color-brown);
            text-align: justify;
            text-indent: 2.5em;
            position: relative;
            z-index: 2;
            font-weight: 400;
            letter-spacing: 0.3px;
            text-shadow: 0.5px 0.5px 1px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .scene-text::first-letter {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--color-gold);
            float: left;

            pointer-events: none;

        .end-title {

        .nav-btn:active:not(:disabled) {
            transform: translateY(-2px) scale(1.05);

            background: #9e9e9e;

        .page-indicator {
            background: linear-gradient(135deg, var(--color-brown-dark), var(--color-brown));
            color: var(--color-ivory);
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.4rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);

            min-width: 200px;
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .page-indicator::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-twilight), var(--color-brown-dark));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            gap: 30px;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 6px solid rgba(201, 167, 105, 0.2);
            border-top-color: var(--color-gold);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            position: relative;
            box-shadow: 0 0 30px rgba(201, 167, 105, 0.3);
        }

        .spinner::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid transparent;
            border-top-color: var(--color-sunset);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
            opacity: 0.5;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--color-gold);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(201, 167, 105, 0.5);
            animation: pulse 2s ease-in-out infinite;
            font-family: 'Crimson Text', serif;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        .page-turn {
            animation: pageTurn 0.8s ease-out;
        }

        @keyframes pageTurn {
            0% {
                transform: rotateY(0deg);
            }
            50% {
                transform: rotateY(-10deg);
            }
            100% {
                transform: rotateY(0deg);
            }
        }

        @media (max-width: 1200px) {

        @media (max-width: 768px) {
            .book-container {

            }
            .book-controls {

            body:not(.mobile-view) .utility-controls {
                top: 15px;

            }

                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
            body:not(.mobile-view) .page {
                padding: 40px 30px;
            }
        }

        @media (max-width: 576px) {
            body:not(.mobile-view) {
                padding: 10px;
            }
            .book-container {
                height: auto;
                min-height: 400px;
                max-height: 85vh;
            }
            body:not(.mobile-view) .page {
                padding: 30px 20px;
            }
            body:not(.mobile-view) .cover-title {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            body:not(.mobile-view) .cover-subtitle {
                font-size: 1.2rem;
                padding: 15px;
            }
            body:not(.mobile-view) .cover-author {
                font-size: 1.2rem;
                padding: 15px 25px;
            }
            body:not(.mobile-view) .scene-title {
                font-size: 1.8rem;
                margin-bottom: 25px;
                padding-bottom: 15px;
            }
            body:not(.mobile-view) .scene-text {
                font-size: 1.1rem;
                line-height: 1.8;
            }
            body:not(.mobile-view) .scene-text::first-letter {
                font-size: 2.8rem;
            }
            body:not(.mobile-view) .end-title {
                font-size: 5rem;
            }
            body:not(.mobile-view) .scene-image-container {
                padding: 20px;
            }
            body:not(.mobile-view) .book-spine {
                display: none;
            }
        }

        @media (orientation: portrait) and (max-width: 768px) {
            body:not(.fullscreen-landscape) {
                display: block;
                padding: 5px;
            }
            body:not(.fullscreen-landscape) .book-container {
                width: 100%;
                height: calc(100vh - 10px);
                margin: 0 auto;
                max-width: 100%;
            }
            .book-content::after {
                display: none;
            }
            .page-left,
            .page-right {
                display: none;
            }
            .single-page {
                display: block !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-paper: #1a1410;
                --color-paper-dark: #14100c;

            .scene-text {

            }
            .page-number {
                color: #b8a58c;
            }
        }

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700;800&display=swap" rel="stylesheet">

<body>
    <div class="orientation-notice" id="orientationNotice">
        <i class="fas fa-sync-alt"></i>
        <p>Gira tu dispositivo a horizontal para mejor experiencia</p>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Abriendo el libro de los sueños...</div>
    </div>

    <div class="book-container">
        <div class="book-wrapper">
            <div class="book" id="book">
                <div class="book-spine">
                    <div class="spine-decoration"></div>
                    <div class="spine-text">PARA JOHANNA ❤️</div>
                </div>

                <div class="book-content" id="bookContent">
                    <!-- Generado dinámicamente -->
                </div>
            </div>
        </div>

        <div class="mobile-controls">
            <button class="mobile-nav-btn" id="mobilePrevBtn" aria-label="Página anterior">
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="mobile-page-indicator">
                <span aria-live="polite"><span id="mobileCurrentPageNum">1</span> de <span id="mobileTotalPages">8</span></span>
            </div>

            <button class="mobile-nav-btn" id="mobileNextBtn" aria-label="Página siguiente">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="book-controls">
            <button class="nav-btn" id="prevBtn" aria-label="Página anterior">
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="page-indicator" id="pageIndicator">
                <span aria-live="polite">Página <span id="currentPageNum">1</span> de <span id="totalPages">8</span></span>
            </div>

            <button class="nav-btn" id="nextBtn" aria-label="Página siguiente">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="utility-controls">
            <button class="utility-btn" id="audioBtn" title="Escuchar poema" aria-label="Escuchar poema">
                <i class="fas fa-play"></i>
            </button>
            <button class="utility-btn" id="fullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </div>

    <script>
        // Poema dividido en 6 fragmentos (imágenes 2 a 7)
        const poemFragments = [{
            id: 1,
            title: "La dulce conspiración",
            text: `Querida dueña de mi desvelo:

            Hay encuentros que prefiero llamar travesuras del destino, pequeños descuidos del universo que prueban que hasta la noche más seria puede volverse cómplice de una sonrisa. Yo, pequeño distraído, vivía sumido en una rutina educada: mi vida ordenada, mi alma en pausa, mi corazón durmiendo la siesta sin que nadie lo molestara. Mis días eran días, mis noches, noches; todo en su sitio, como un libro que nadie había abierto todavía.`,
            image: "Escena2.png"
        }, {
            id: 2,
            title: "El destello distinto",
            text: `Nunca supe cómo llegaste. Sospecho que fue con sigilo y una risa escondida en el bolsillo. Solo recuerdo que un día, en medio de un gris bien comportado, apareció un destello distinto: cabello negro como trampa de luceros, piel donde el sol se volvió perezoso y decidió quedarse a vivir. Y luego tus ojos —ay, tus ojos— con ese brillo de quien ya sabe que va a robarme el sueño antes de que yo lo sepa.`,
            image: "Escena3.png"
        }, {
            id: 3,
            title: "El sortilegio en tu mirar",
            text: `Mi instinto, ese que creía marchito, despertó de golpe y me susurró al oído: "Cuidado. Ella no pasa de largo."

            Bella niña que heredó la luz de su propia risa, ¿qué sortilegio cabe en tu mirar? Llegaste y, sin esfuerzo, me volviste cómplice de tu hechizo. Ya no solo te miro: te invento, te espero, te encuentro en cualquier excusa. Y cuando me ves con ese gesto de quien lo sabe todo, yo finjo que no me rindo… pero me rindo.`,
            image: "Escena4.png"
        }, {
            id: 4,
            title: "El escenario de tu luz",
            text: `Ahora, mientras tejeo versos que nunca te diré del todo, mi mundo ya no es mío: es el escenario donde tú apareces con tu pelo negro y tu piel morena a desordenarme el alma con esa luz traviesa que llevas en los ojos. Cada palabra que escribo es un intento de atrapar tu risa, de dibujar tu sombra en el papel, de hacer eterno el instante en que me miras.`,
            image: "Escena5.png"
        }, {
            id: 5,
            title: "La razón para escribir",
            text: `Porque tú me diste una razón para escribir, una excusa para desvelarme, un motivo para creer que las palabras pueden ser más que sonidos. Tú convertiste mi silencio en poesía y mi rutina en un jardín de sorpresas. Ahora cada verso lleva tu nombre, cada rima es un susurro que te busca, cada estrofa es un paso más hacia tu corazón.`,
            image: "Escena6.png"
        }, {
            id: 6,
            title: "La más oculta verdad",
            text: `Y yo te doy, entre coqueta y honesta, la más oculta de mis verdades:

            Que me gustas.
            Y que me encanta que me gustes.

            Porque tú eres mi poema favorito, el que nunca termino de leer, el que siempre quiero empezar de nuevo. Gracias por ser la musa que despertó al poeta que llevaba dentro, por ser la razón de cada letra que escribo y cada latido que siento.`,
            image: "Escena7.png"
        }];

        let currentPage = 0;
        let totalPages = poemFragments.length + 2;
        let isSpeaking = false;
        let speech = null;
        let currentVoice = null;
        let isMobileView = false;
        let isFullscreenMode = false;

        document.addEventListener('DOMContentLoaded', function() {
            checkViewport();
            initBook();
            setupControls();
            loadVoices();
            setupOrientationCheck();

            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }, 1500);

            window.addEventListener('resize', checkViewport);
            window.addEventListener('orientationchange', checkViewport);
        });

        function checkViewport() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isSmallScreen = window.innerWidth <= 768;

            isMobileView = isSmallScreen || isPortrait;

            if (isMobileView && !isFullscreenMode) {
                document.body.classList.add('mobile-view');
                document.body.classList.remove('fullscreen-landscape');
                showMobileControls();
            } else {
                document.body.classList.remove('mobile-view');
                if (isFullscreenMode) {
                    document.body.classList.add('fullscreen-landscape');
                }
                hideMobileControls();
            }

            updatePageDisplay();
            checkOrientation();
        }

        function checkOrientation() {
            const orientationNotice = document.getElementById('orientationNotice');
            const isPortrait = window.innerHeight > window.innerWidth;
            const isSmallScreen = window.innerWidth <= 768;

            if (isFullscreenMode && isPortrait && isSmallScreen) {
                orientationNotice.style.display = 'flex';
                setTimeout(() => {
                    if (orientationNotice.style.display === 'flex') {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                }, 1000);
            } else {
                orientationNotice.style.display = 'none';
            }
        }

        function setupOrientationCheck() {
            if (screen.orientation) {
                screen.orientation.addEventListener('change', checkOrientation);
            }
        }

        function showMobileControls() {
            document.getElementById('mobilePrevBtn').style.display = 'flex';
            document.getElementById('mobileNextBtn').style.display = 'flex';
        }

        function hideMobileControls() {
            document.getElementById('mobilePrevBtn').style.display = 'none';
            document.getElementById('mobileNextBtn').style.display = 'none';
        }

        function initBook() {
            renderPage();
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('mobileTotalPages').textContent = totalPages;
        }

        function updatePageDisplay() {
            renderPage();
        }

        function renderPage() {
            const bookContent = document.getElementById('bookContent');
            const book = document.getElementById('book');

            book.classList.add('page-turn');
            setTimeout(() => book.classList.remove('page-turn'), 800);

            let html = '';

            if (currentPage === 0) {
                if (isMobileView && !isFullscreenMode) {
                    html = `
                        <div class="single-page cover-page">
                            <div class="cover-ornament ornament-tl">❤️</div>
                            <div class="cover-ornament ornament-tr">✦</div>
                            <div class="cover-ornament ornament-bl">✿</div>
                            <div class="cover-ornament ornament-br">❤️</div>
                            <h1 class="cover-title">Para Johanna</h1>
                            <p class="cover-subtitle">La dulce conspiración</p>
                            <p class="cover-author">Un poema de amor</p>
                            <div class="page-number mobile-left">Portada</div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="cover-page">
                            <div class="cover-ornament ornament-tl">❤️</div>
                            <div class="cover-ornament ornament-tr">✦</div>
                            <div class="cover-ornament ornament-bl">✿</div>
                            <div class="cover-ornament ornament-br">❤️</div>
                            <h1 class="cover-title">Para Johanna</h1>
                            <p class="cover-subtitle">La dulce conspiración</p>
                            <p class="cover-author">Un poema de amor</p>
                        </div>
                    `;
                }
            } else if (currentPage === totalPages - 1) {
                if (isMobileView && !isFullscreenMode) {
                    html = `
                        <div class="single-page end-page">
                            <div class="end-title">FIN</div>
                            <div class="page-number mobile-left">Final</div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="end-page">
                            <div class="end-title">FIN</div>
                        </div>
                    `;
                }
            } else {
                const fragment = poemFragments[currentPage - 1];
                if (isMobileView && !isFullscreenMode) {
                    html = `
                        <div class="single-page scene-page">
                            <h2 class="scene-title">${fragment.title}</h2>
                            <p class="scene-text">${fragment.text}</p>
                            <div class="scene-image-container">
                                <img class="scene-image" src="${fragment.image}" alt="${fragment.title}" 
                                     onerror="this.src='https://images.unsplash.com/photo-1518893494013-481c1d8ed3fd?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80&txt=${fragment.title}'">
                            </div>
                            <div class="page-number mobile-left">${currentPage}</div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="page page-left">
                            <h2 class="scene-title">${fragment.title}</h2>
                            <p class="scene-text">${fragment.text}</p>
                            <div class="page-number">${currentPage}</div>
                        </div>
                        <div class="page page-right">
                            <div class="scene-image-container">
                                <img class="scene-image" src="${fragment.image}" alt="${fragment.title}" 
                                     onerror="this.src='https://images.unsplash.com/photo-1518893494013-481c1d8ed3fd?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80&txt=${fragment.title}'">
                            </div>
                            <div class="page-number">${currentPage}</div>
                        </div>
                    `;
                }
            }

            bookContent.innerHTML = html;
            updateControls();

            if (currentPage > 0 && currentPage < totalPages - 1) {
                preloadNextImage();
            }
        }

        function updateControls() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const mobilePrevBtn = document.getElementById('mobilePrevBtn');
            const mobileNextBtn = document.getElementById('mobileNextBtn');
            const currentPageNum = document.getElementById('currentPageNum');
            const mobileCurrentPageNum = document.getElementById('mobileCurrentPageNum');
            const audioBtn = document.getElementById('audioBtn');

            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === totalPages - 1;
            mobilePrevBtn.disabled = currentPage === 0;
            mobileNextBtn.disabled = currentPage === totalPages - 1;

            let pageDisplay = '';
            if (currentPage === 0) {
                pageDisplay = 'Portada';
            } else if (currentPage === totalPages - 1) {
                pageDisplay = 'Final';
            } else {
                pageDisplay = currentPage;
            }

            currentPageNum.textContent = pageDisplay;
            mobileCurrentPageNum.textContent = pageDisplay;

            const shouldShowAudioBtn = currentPage > 0 && currentPage < totalPages - 1;
            audioBtn.style.display = shouldShowAudioBtn ? 'flex' : 'none';

            if (isSpeaking) {
                audioBtn.innerHTML = '<i class="fas fa-stop"></i>';
                audioBtn.classList.add('active-audio');
            } else {
                audioBtn.innerHTML = '<i class="fas fa-play"></i>';
                audioBtn.classList.remove('active-audio');
            }

            if (isSpeaking && (currentPage === 0 || currentPage === totalPages - 1)) {
                stopSpeech();
            }
        }

        function nextPage() {
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderPage();
                stopSpeech();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
                stopSpeech();
            }
        }

        function setupControls() {
            document.getElementById('prevBtn').addEventListener('click', prevPage);
            document.getElementById('nextBtn').addEventListener('click', nextPage);
            document.getElementById('mobilePrevBtn').addEventListener('click', prevPage);
            document.getElementById('mobileNextBtn').addEventListener('click', nextPage);
            document.getElementById('audioBtn').addEventListener('click', toggleSpeech);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    toggleSpeech();
                }
                if (e.key === 'Escape' && isFullscreen()) {
                    exitFullscreen();
                }
            });

            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;

            document.getElementById('bookContent').addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });

            document.getElementById('bookContent').addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;

                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                    if (diffX > 0) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                }
            }

            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                speechSynthesis.onvoiceschanged = () => {
                    const voices = speechSynthesis.getVoices();
                    const latinSpanishVoices = voices.filter(voice =>
                        voice.lang.startsWith('es') &&
                        (voice.name.includes('Latino') || voice.name.includes('Latin') || voice.lang.includes('419'))
                    );

                    if (latinSpanishVoices.length > 0) {
                        currentVoice = latinSpanishVoices[0];
                    } else {
                        const spanishVoices = voices.filter(voice => voice.lang.startsWith('es'));
                        if (spanishVoices.length > 0) {
                            currentVoice = spanishVoices[0];
                        }
                    }
                };

                speechSynthesis.getVoices();
            }
        }

        function toggleSpeech() {
            if (isSpeaking) {
                stopSpeech();
            } else {
                playSceneSpeech();
            }
        }

        function playSceneSpeech() {
            if (currentPage < 1 || currentPage > poemFragments.length) return;

            const fragment = poemFragments[currentPage - 1];
            const fullText = `${fragment.title}. ${fragment.text}`;

            if ('speechSynthesis' in window) {
                stopSpeech();

                speech = new SpeechSynthesisUtterance();
                speech.text = fullText;
                speech.lang = 'es-LA';
                speech.rate = 0.9;
                speech.pitch = 1.0;
                speech.volume = 1;

                if (currentVoice) {
                    speech.voice = currentVoice;
                }

                speech.onstart = () => {
                    isSpeaking = true;
                    document.getElementById('audioBtn').innerHTML = '<i class="fas fa-stop"></i>';
                    document.getElementById('audioBtn').classList.add('active-audio');
                };

                speech.onend = () => {
                    isSpeaking = false;
                    document.getElementById('audioBtn').innerHTML = '<i class="fas fa-play"></i>';
                    document.getElementById('audioBtn').classList.remove('active-audio');
                };

                speech.onerror = () => {
                    isSpeaking = false;
                    document.getElementById('audioBtn').innerHTML = '<i class="fas fa-play"></i>';
                    document.getElementById('audioBtn').classList.remove('active-audio');
                };

                speechSynthesis.speak(speech);
            } else {
                alert('Tu navegador no soporta síntesis de voz. Prueba con Chrome o Edge.');
            }
        }

        function stopSpeech() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('audioBtn').innerHTML = '<i class="fas fa-play"></i>';
                document.getElementById('audioBtn').classList.remove('active-audio');
            }
        }

        function preloadNextImage() {
            const nextFragment = poemFragments[currentPage];
            if (nextFragment) {
                const img = new Image();
                img.src = nextFragment.image;
            }
        }

        function toggleFullscreen() {
            if (!isFullscreen()) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        }

        function enterFullscreen() {
            const elem = document.documentElement;

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }

            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        function isFullscreen() {
            return !!(document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement);
        }

        function handleFullscreenChange() {
            const btn = document.getElementById('fullscreenBtn');
            isFullscreenMode = isFullscreen();

            if (isFullscreenMode) {
                document.body.classList.add('fullscreen-landscape');
                btn.innerHTML = '<i class="fas fa-compress"></i>';
                btn.title = 'Salir de pantalla completa';
                document.body.classList.remove('mobile-view');
                hideMobileControls();
                updatePageDisplay();
            } else {
                document.body.classList.remove('fullscreen-landscape');
                btn.innerHTML = '<i class="fas fa-expand"></i>';
                btn.title = 'Pantalla completa';
                setTimeout(checkViewport, 100);
            }

            checkOrientation();
        }

        window.addEventListener('beforeunload', stopSpeech);
        window.addEventListener('pagehide', stopSpeech);
    </script>
</body>
</html>
