<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wilmagy - La Princesa Solar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --color-paper: #faf4e9;
            --color-paper-dark: #f5ebd7;
            --color-gold: #c9a769;
            --color-gold-light: #e3c9a0;
            --color-brown: #7a4e2a;
            --color-brown-dark: #5a371f;
            --color-brown-light: #9e6d3f;
            --color-burgundy: #8b4513;
            --color-ivory: #f8f3e6;
            --color-sunset: #e67e22;
            --color-twilight: #2c3e50;
            --color-bloom: #e74c3c;
            --color-cherry: #c0392b;
            --color-tulip: #e74c3c;
            --color-sky: #3498db;
            --mobile-header-height: 60px;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, var(--color-twilight) 0%, var(--color-brown-dark) 50%, var(--color-brown) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Crimson Text', 'Georgia', serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(231, 76, 60, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(52, 152, 219, 0.1) 0%, transparent 20%);
            position: relative;
            transition: padding 0.3s ease;
        }

        /* Modo móvil - Vista única */
        body.mobile-view {
            padding: 5px;
            display: block;
        }

        body.mobile-view .book-container {
            width: 100%;
            height: calc(100vh - 10px);
            margin: 0 auto;
            max-width: 100%;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        body.mobile-view .book-content {
            border-radius: 8px;
        }

        body.mobile-view .page {
            width: 100%;
            padding: 15px;
        }

        body.mobile-view .page-left,
        body.mobile-view .page-right {
            display: none;
        }

        body.mobile-view .single-page {
            display: block !important;
            padding: 60px 20px 70px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }

        body.mobile-view .single-page.scene-page .scene-image-container {
            margin: 25px auto;
            max-width: 95%;
            padding: 15px;
        }

        body.mobile-view .scene-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
        }

        body.mobile-view .scene-text {
            font-size: 1rem;
            line-height: 1.7;
            text-indent: 1.5em;
            margin-bottom: 25px;
        }

        body.mobile-view .scene-text::first-letter {
            font-size: 2.2rem;
        }

        body.mobile-view .cover-title {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        body.mobile-view .cover-subtitle {
            font-size: 1rem;
            padding: 12px;
            margin-bottom: 25px;
        }

        body.mobile-view .cover-author {
            font-size: 0.9rem;
            padding: 10px 20px;
        }

        body.mobile-view .end-title {
            font-size: 3.5rem;
            letter-spacing: 3px;
        }

        body.mobile-view .book-spine {
            display: none;
        }

        body.mobile-view .book-content::after {
            display: none;
        }

        body.mobile-view .page-number {
            position: fixed;
            bottom: 55px;
            background: rgba(122, 78, 42, 0.15);
            padding: 4px 12px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            border: 1px solid rgba(201, 167, 105, 0.2);
        }

        body.mobile-view .page-number.mobile-left {
            left: 15px;
            right: auto;
        }

        body.mobile-view .page-number.mobile-right {
            right: 15px;
            left: auto;
        }

        /* Controles móviles mejorados y más compactos */
        .mobile-controls {
            position: fixed;
            bottom: 8px;
            left: 8px;
            right: 8px;
            display: none;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(90, 55, 31, 0.9), rgba(122, 78, 42, 0.9));
            padding: 8px 15px;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1.5px solid var(--color-gold);
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        body.mobile-view .mobile-controls {
            display: flex;
        }

        .mobile-nav-btn {
            background: linear-gradient(135deg, var(--color-gold), var(--color-sunset));
            color: var(--color-ivory);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .mobile-nav-btn:active {
            transform: scale(0.92);
        }

        .mobile-page-indicator {
            color: var(--color-ivory);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 6px 15px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            min-width: 100px;
            text-align: center;
            border: 1px solid rgba(201, 167, 105, 0.25);
        }

        /* Botones de utilidad optimizados para móvil */
        .utility-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        body.mobile-view .utility-controls {
            top: 6px;
            right: 6px;
            gap: 5px;
        }

        .utility-btn {
            background: linear-gradient(135deg, rgba(90, 55, 31, 0.9), rgba(122, 78, 42, 0.9));
            color: var(--color-ivory);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.4),
                0 0 0 2px var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body.mobile-view .utility-btn {
            width: 30px;
            height: 30px;
            font-size: 0.8rem;
            box-shadow: 
                0 3px 10px rgba(0, 0, 0, 0.15),
                0 0 0 1px var(--color-gold);
            background: linear-gradient(135deg, rgba(90, 55, 31, 0.85), rgba(122, 78, 42, 0.85));
        }

        .utility-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.2));
            border-radius: 50%;
            z-index: 1;
        }

        body.mobile-view .utility-btn::before {
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.15));
        }

        .utility-btn i {
            position: relative;
            z-index: 2;
        }

        .utility-btn:hover {
            background: linear-gradient(135deg, var(--color-brown-light), var(--color-sunset));
            transform: scale(1.15) rotate(5deg);
            box-shadow: 
                0 12px 35px rgba(231, 126, 34, 0.5),
                0 0 0 2px var(--color-gold);
        }

        body.mobile-view .utility-btn:active {
            transform: scale(0.95);
            background: linear-gradient(135deg, var(--color-sunset), var(--color-tulip));
        }

        /* Estado activo para botón de audio */
        .utility-btn.active-audio {
            background: linear-gradient(135deg, var(--color-sunset), var(--color-tulip));
            animation: pulse-audio 1.5s infinite;
        }

        @keyframes pulse-audio {
            0%, 100% { 
                box-shadow: 
                    0 3px 10px rgba(0, 0, 0, 0.3),
                    0 0 0 1px var(--color-gold),
                    0 0 0 0 rgba(231, 126, 34, 0.4);
            }
            50% { 
                box-shadow: 
                    0 3px 10px rgba(0, 0, 0, 0.3),
                    0 0 0 1px var(--color-gold),
                    0 0 0 8px rgba(231, 126, 34, 0);
            }
        }

        /* Pantalla completa horizontal */
        body.fullscreen-landscape {
            padding: 0;
            transform: rotate(0deg);
            overflow: hidden;
        }

        body.fullscreen-landscape .book-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            margin: 0;
            border-radius: 0;
        }

        /* Ajustes específicos para pantalla completa horizontal */
        body.fullscreen-landscape .utility-btn {
            width: 30px;
            height: 30px;
            font-size: 0.8rem;
            box-shadow: 
                0 3px 8px rgba(0, 0, 0, 0.15),
                0 0 0 1px var(--color-gold);
        }
        
        body.fullscreen-landscape .utility-controls {
            top: 8px;
            right: 8px;
            gap: 6px;
        }

        body.fullscreen-landscape .book-content {
            border-radius: 0;
            box-shadow: none;
        }

        /* Aviso de orientación */
        .orientation-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-twilight);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--color-gold);
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .orientation-notice i {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: rotate 2s ease-in-out infinite;
        }

        .orientation-notice p {
            font-size: 1.2rem;
            max-width: 250px;
            line-height: 1.5;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .book-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 700px;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.5));
            transition: all 0.3s ease;
        }

        .book-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 2000px;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .book-content {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--color-paper);
            border-radius: 8px 20px 20px 8px;
            box-shadow: 
                -15px 0 40px rgba(0, 0, 0, 0.5),
                0 25px 70px rgba(0, 0, 0, 0.4),
                inset 1px 0 0 rgba(255, 255, 255, 0.1);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(90, 55, 31, 0.3);
        }

        /* Textura de papel antiguo mejorada */
        .book-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(90deg, transparent 50%, rgba(122, 78, 42, 0.03) 100%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(122, 78, 42, 0.05) 1px,
                    rgba(122, 78, 42, 0.05) 2px
                ),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%237a4e2a' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Lomo del libro mejorado */
        .book-spine {
            position: absolute;
            left: -50px;
            top: 15px;
            bottom: 15px;
            width: 50px;
            background: linear-gradient(to right, 
                var(--color-brown-dark) 0%, 
                var(--color-brown) 20%, 
                var(--color-gold) 50%, 
                var(--color-brown) 80%, 
                var(--color-brown-dark) 100%);
            box-shadow: 
                inset -5px 0 15px rgba(0, 0, 0, 0.8),
                5px 0 20px rgba(0, 0, 0, 0.6);
            z-index: 10;
            border-radius: 5px 0 0 5px;
            border-left: 2px solid rgba(201, 167, 105, 0.3);
        }

        .spine-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            color: var(--color-ivory);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            white-space: nowrap;
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(201, 167, 105, 0.3);
            font-family: 'Crimson Text', serif;
            text-transform: uppercase;
        }

        .spine-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 20%, rgba(201, 167, 105, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(201, 167, 105, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .book-content::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 30px;
            transform: translateX(-50%);
            background: linear-gradient(to right, 
                transparent, 
                rgba(0, 0, 0, 0.1) 5%, 
                rgba(0, 0, 0, 0.15) 50%, 
                rgba(0, 0, 0, 0.1) 95%, 
                transparent
            );
            z-index: 5;
            pointer-events: none;
            box-shadow: 
                inset -1px 0 0 rgba(255, 255, 255, 0.1),
                inset 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        /* Páginas */
        .page {
            width: 50%;
            height: 100%;
            padding: 60px 50px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 2;
        }

        .single-page {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .page::-webkit-scrollbar {
            width: 8px;
        }

        .page::-webkit-scrollbar-track {
            background: rgba(122, 78, 42, 0.1);
            border-radius: 4px;
        }

        .page::-webkit-scrollbar-thumb {
            background: var(--color-gold);
            border-radius: 4px;
        }

        .page-left {
            background: var(--color-paper-dark);
            border-right: 1px solid rgba(122, 78, 42, 0.2);
            box-shadow: 
                inset -5px 0 10px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .page-right {
            background: var(--color-paper);
            box-shadow: 
                inset 5px 0 10px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        /* Portada mejorada */
        .cover-page {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                var(--color-twilight) 0%, 
                var(--color-sunset) 30%, 
                var(--color-gold) 70%, 
                var(--color-tulip) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 60px;
            position: relative;
            overflow: hidden;
        }

        body.mobile-view .cover-page {
            padding: 40px 20px;
        }

        .cover-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 0, 0, 0.2) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M45 80c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32zm110 50c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32zM95 180c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .cover-ornament {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            font-size: 8rem;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        body.mobile-view .cover-ornament {
            font-size: 4rem;
        }

        .ornament-tl { top: 40px; left: 40px; animation: float 20s infinite linear; }
        .ornament-tr { top: 40px; right: 40px; animation: float 20s infinite linear reverse; }
        .ornament-bl { bottom: 40px; left: 40px; animation: float 25s infinite linear; }
        .ornament-br { bottom: 40px; right: 40px; animation: float 25s infinite linear reverse; }

        body.mobile-view .ornament-tl { top: 20px; left: 20px; }
        body.mobile-view .ornament-tr { top: 20px; right: 20px; }
        body.mobile-view .ornament-bl { bottom: 20px; left: 20px; }
        body.mobile-view .ornament-br { bottom: 20px; right: 20px; }

        @keyframes float {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cover-title {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--color-ivory);
            margin-bottom: 30px;
            letter-spacing: 6px;
            text-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(231, 126, 34, 0.5),
                0 0 80px rgba(201, 167, 105, 0.3);
            z-index: 1;
            position: relative;
            font-family: 'Crimson Text', serif;
            line-height: 1.2;
            padding-bottom: 20px;
            border-bottom: 3px double rgba(255, 255, 255, 0.3);
        }

        body.mobile-view .cover-title {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .cover-title::after {
            content: '✦';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--color-gold);
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(201, 167, 105, 0.5);
        }

        body.mobile-view .cover-title::after {
            font-size: 1.2rem;
            bottom: -8px;
        }

        .cover-subtitle {
            font-size: 1.8rem;
            font-style: italic;
            color: var(--color-gold-light);
            margin-bottom: 50px;
            max-width: 700px;
            line-height: 1.6;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
            z-index: 1;
            position: relative;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(201, 167, 105, 0.3);
            backdrop-filter: blur(5px);
        }

        body.mobile-view .cover-subtitle {
            font-size: 1rem;
            padding: 12px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .cover-author {
            font-size: 1.5rem;
            color: var(--color-gold-light);
            padding: 20px 40px;
            border-top: 2px solid rgba(201, 167, 105, 0.4);
            z-index: 1;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-top: 30px;
            letter-spacing: 2px;
        }

        body.mobile-view .cover-author {
            font-size: 0.9rem;
            padding: 10px 20px;
            margin-top: 20px;
        }

        .cover-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(231, 126, 34, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(52, 152, 219, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Contenido de las páginas mejorado */
        .scene-title {
            font-size: 2.8rem;
            color: var(--color-brown-dark);
            margin-bottom: 40px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 4px double var(--color-gold);
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-family: 'Crimson Text', serif;
        }

        .scene-title::before,
        .scene-title::after {
            content: '❀';
            position: absolute;
            bottom: -15px;
            color: var(--color-tulip);
            font-size: 1.5rem;
            opacity: 0.7;
        }

        .scene-title::before {
            left: 0;
        }

        .scene-title::after {
            right: 0;
        }

        body.mobile-view .scene-title::before,
        body.mobile-view .scene-title::after {
            font-size: 1rem;
            bottom: -10px;
        }

        .scene-text {
            font-size: 1.45rem;
            line-height: 2.1;
            color: var(--color-brown);
            text-align: justify;
            text-indent: 2.5em;
            position: relative;
            z-index: 2;
            font-weight: 400;
            letter-spacing: 0.3px;
            text-shadow: 0.5px 0.5px 1px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }

        .scene-text::first-letter {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--color-gold);
            float: left;
            line-height: 1;
            margin-right: 10px;
            margin-top: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .scene-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
            position: relative;
        }

        body.mobile-view .scene-image-container {
            padding: 20px;
        }

        .scene-image-container::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 2px solid var(--color-gold);
            border-radius: 10px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        body.mobile-view .scene-image-container::before {
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
        }

        .scene-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(122, 78, 42, 0.3),
                0 0 0 12px var(--color-paper),
                0 0 0 14px rgba(122, 78, 42, 0.2);
            filter: sepia(0.2) brightness(1.05);
            transition: all 0.5s ease;
            z-index: 2;
        }

        body.mobile-view .scene-image {
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                0 3px 10px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(122, 78, 42, 0.2),
                0 0 0 8px var(--color-paper),
                0 0 0 10px rgba(122, 78, 42, 0.15);
        }

        .scene-image:hover {
            transform: scale(1.02);
            filter: sepia(0) brightness(1.1);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.5),
                0 8px 20px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(122, 78, 42, 0.4),
                0 0 0 12px var(--color-paper),
                0 0 0 14px rgba(122, 78, 42, 0.3);
        }

        .page-number {
            position: absolute;
            bottom: 25px;
            font-size: 1.2rem;
            color: var(--color-brown);
            font-style: italic;
            z-index: 2;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .page-left .page-number {
            display: none;
        }

        .page-right .page-number {
            right: 50px;
        }

        /* Página final mejorada */
        .end-page {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                var(--color-twilight) 0%, 
                var(--color-brown-dark) 50%, 
                var(--color-sunset) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .end-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(231, 126, 34, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(201, 167, 105, 0.2) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .end-title {
            font-size: 9rem;
            font-weight: 800;
            color: var(--color-gold);
            text-shadow: 
                5px 5px 20px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(231, 126, 34, 0.6),
                0 0 100px rgba(201, 167, 105, 0.4);
            transform: rotate(-5deg);
            position: relative;
            z-index: 1;
            font-family: 'Crimson Text', serif;
            letter-spacing: 8px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        body.mobile-view .end-title {
            font-size: 3.5rem;
            letter-spacing: 3px;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    5px 5px 20px rgba(0, 0, 0, 0.8),
                    0 0 60px rgba(231, 126, 34, 0.6),
                    0 0 100px rgba(201, 167, 105, 0.4);
            }
            to {
                text-shadow: 
                    5px 5px 20px rgba(0, 0, 0, 0.8),
                    0 0 80px rgba(231, 126, 34, 0.8),
                    0 0 120px rgba(201, 167, 105, 0.6);
            }
        }

        /* Controles mejorados */
        .book-controls {
            position: absolute;
            bottom: -120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            align-items: center;
            z-index: 20;
        }

        .nav-btn {
            background: linear-gradient(135deg, var(--color-brown-dark), var(--color-brown-light));
            color: var(--color-ivory);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.8rem;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                0 10px 30px rgba(139, 69, 19, 0.5),
                0 0 0 2px var(--color-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.2));
            border-radius: 50%;
            z-index: 1;
        }

        .nav-btn i {
            position: relative;
            z-index: 2;
        }

        .nav-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--color-brown-light), var(--color-sunset));
            transform: translateY(-5px) scale(1.1);
            box-shadow: 
                0 15px 40px rgba(231, 126, 34, 0.6),
                0 0 0 2px var(--color-gold);
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
        }

        .nav-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .page-indicator {
            background: linear-gradient(135deg, var(--color-brown-dark), var(--color-brown));
            color: var(--color-ivory);
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 1.4rem;
            font-weight: 600;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 3px solid var(--color-gold);
            min-width: 200px;
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .page-indicator::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
        }

        /* Pantalla de carga */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--color-twilight), var(--color-brown-dark));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            gap: 30px;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 6px solid rgba(201, 167, 105, 0.2);
            border-top-color: var(--color-gold);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            position: relative;
            box-shadow: 0 0 30px rgba(201, 167, 105, 0.3);
        }

        .spinner::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid transparent;
            border-top-color: var(--color-sunset);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
            opacity: 0.5;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--color-gold);
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(201, 167, 105, 0.5);
            animation: pulse 2s ease-in-out infinite;
            font-family: 'Crimson Text', serif;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Efecto de página volteada */
        .page-turn {
            animation: pageTurn 0.8s ease-out;
        }

        @keyframes pageTurn {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(-10deg); }
            100% { transform: rotateY(0deg); }
        }

        /* Responsive mejorado */
        @media (max-width: 1200px) {
            .book-container {
                height: 600px;
            }
            
            .cover-title {
                font-size: 3.8rem;
            }
            
            .scene-title {
                font-size: 2.4rem;
            }
            
            .scene-text {
                font-size: 1.3rem;
            }
            
            .page {
                padding: 50px 40px;
            }
        }

        @media (max-width: 992px) {
            .book-container {
                height: 550px;
            }
            
            .cover-title {
                font-size: 3.2rem;
                letter-spacing: 4px;
            }
            
            .cover-subtitle {
                font-size: 1.5rem;
            }
            
            .scene-title {
                font-size: 2rem;
            }
            
            .scene-text {
                font-size: 1.2rem;
                line-height: 1.9;
            }
            
            .end-title {
                font-size: 7rem;
            }
            
            .book-spine {
                left: -40px;
                width: 40px;
            }
            
            .spine-text {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 768px) {
            .book-container {
                height: auto;
                min-height: 500px;
                max-height: 90vh;
            }
            
            .book-controls {
                display: none;
            }
            
            body:not(.mobile-view) .utility-controls {
                top: 15px;
                right: 15px;
                gap: 10px;
            }
            
            body:not(.mobile-view) .utility-btn {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
            
            body:not(.mobile-view) .page {
                padding: 40px 30px;
            }
        }

        @media (max-width: 576px) {
            body:not(.mobile-view) {
                padding: 10px;
            }
            
            .book-container {
                height: auto;
                min-height: 400px;
                max-height: 85vh;
            }
            
            body:not(.mobile-view) .page {
                padding: 30px 20px;
            }
            
            body:not(.mobile-view) .cover-title {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            
            body:not(.mobile-view) .cover-subtitle {
                font-size: 1.2rem;
                padding: 15px;
            }
            
            body:not(.mobile-view) .cover-author {
                font-size: 1.2rem;
                padding: 15px 25px;
            }
            
            body:not(.mobile-view) .scene-title {
                font-size: 1.8rem;
                margin-bottom: 25px;
                padding-bottom: 15px;
            }
            
            body:not(.mobile-view) .scene-text {
                font-size: 1.1rem;
                line-height: 1.8;
            }
            
            body:not(.mobile-view) .scene-text::first-letter {
                font-size: 2.8rem;
            }
            
            body:not(.mobile-view) .end-title {
                font-size: 5rem;
            }
            
            body:not(.mobile-view) .scene-image-container {
                padding: 20px;
            }
            
            body:not(.mobile-view) .book-spine {
                display: none;
            }
        }

        @media (orientation: portrait) and (max-width: 768px) {
            body:not(.fullscreen-landscape) {
                display: block;
                padding: 5px;
            }
            
            body:not(.fullscreen-landscape) .book-container {
                width: 100%;
                height: calc(100vh - 10px);
                margin: 0 auto;
                max-width: 100%;
            }
            
            .book-content::after {
                display: none;
            }
            
            .page-left, .page-right {
                display: none;
            }
            
            .single-page {
                display: block !important;
            }
        }

        /* Mejora de accesibilidad */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Modo oscuro */
        @media (prefers-color-scheme: dark) {
            :root {
                --color-paper: #1a1a1a;
                --color-paper-dark: #141414;
                --color-ivory: #2a2a2a;
                --color-brown: #8b7355;
                --color-brown-dark: #69563f;
                --color-brown-light: #a8875f;
            }
            
            .scene-text {
                color: #d4c6b5;
            }
            
            .scene-title {
                color: #e0d0b8;
            }
            
            .page-number {
                color: #b8a58c;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700;800&display=swap" rel="stylesheet">

<body>
    <div class="orientation-notice" id="orientationNotice">
        <i class="fas fa-sync-alt"></i>
        <p>Por favor, gira tu dispositivo a horizontal para una mejor experiencia</p>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Abriendo el jardín secreto...</div>
    </div>
    
    <div class="book-container">
        <div class="book-wrapper">
            <div class="book" id="book">
                <div class="book-spine">
                    <div class="spine-decoration"></div>
                    <div class="spine-text">LA PRINCESA SOLAR</div>
                </div>
                
                <div class="book-content" id="bookContent">
                    <!-- Contenido generado dinámicamente -->
                </div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <button class="mobile-nav-btn" id="mobilePrevBtn" aria-label="Página anterior">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <div class="mobile-page-indicator">
                <span aria-live="polite"><span id="mobileCurrentPageNum">1</span> de <span id="mobileTotalPages">8</span></span>
            </div>
            
            <button class="mobile-nav-btn" id="mobileNextBtn" aria-label="Página siguiente">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        
        <div class="book-controls">
            <button class="nav-btn" id="prevBtn" aria-label="Página anterior">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <div class="page-indicator" id="pageIndicator">
                <span aria-live="polite">Página <span id="currentPageNum">1</span> de <span id="totalPages">8</span></span>
            </div>
            
            <button class="nav-btn" id="nextBtn" aria-label="Página siguiente">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        
        <div class="utility-controls">
            <button class="utility-btn" id="audioBtn" title="Reproducir narración" aria-label="Reproducir narración">
                <i class="fas fa-play"></i>
            </button>
            <button class="utility-btn" id="fullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </div>

    <script>
        const scenes = [
            {
                id: 1,
                title: "EL JARDÍN DEL ENCUENTRO",
                text: "Entre los tulipanes parlantes y los cerezos que guardan secretos, la princesa Magy apareció con su cabello de atardecer y sus pecas estelares. Un joven jardinero, que todas las mañanas ordenaba el rocío sobre los pétalos, fue el primero en ver su risa hacer florecer capullos cerrados.",
                image: "Escena1.jpg"
            },
            {
                id: 2,
                title: "LAS LECCIONES DEL JARDÍN",
                text: "Magy enseñaba que la valentía puede ser tierna y que la alegría sincera es un lenguaje universal. El jardinero aprendió de ella, mientras podaba rosales, que las cosas más frágiles suelen ser las más resistentes. Cada tarde, él le mostraba nuevas flores que había hecho crecer solo para ver iluminarse sus ojos.",
                image: "Escena2.jpg"
            },
            {
                id: 3,
                title: "EL TULIPÁN TRANSPARENTE",
                text: "Un día, entre los tulipanes rojos que el jardinero había plantado especialmente para ella, apareció uno diferente: de pétalos cristalinos con sol danzante dentro. 'Tu hogar te espera, princesa Solar', susurró. Magy comprendió entonces su origen, mientras el jardinero, con las manos aún terrosas, sintió que el jardín perdería su luz.",
                image: "Escena3.jpg"
            },
            {
                id: 4,
                title: "LA PROMESA NO DICHA",
                text: "Antes de que Magy ascendiera por el camino de pétalos luminosos, el jardinero le entregó un ramo único: cerezos y tulipanes entrelazados. 'Para que recuerdes que aquí floreció tu alegría', dijo, guardando en su corazón todo lo demás. Esa noche, y todas las que siguieron, él comenzó un ritual: escribir un breve poema y lanzarlo al cielo, seguro de que los vientos solares lo llevarían hasta ella.",
                image: "Escena4.jpg"
            },
            {
                id: 5,
                title: "EL RITUAL NOCTURNO",
                text: "Cada noche, cuando el jardín duerme, el jardinero pliega pequeños versos en forma de flores y los suelta hacia las estrellas. Los poemas hablan de tulipanes que aún la recuerdan, de cerezos que añoran su risa, de un jardín que espera. Él sabe que Magy debe cumplir su destino solar, pero también cree, con certeza quieta, que los caminos de luz siempre traen de regreso lo que verdaderamente pertenece a la tierra.",
                image: "Escena5.jpg"
            },
            {
                id: 6,
                title: "EL JARDÍN QUE ESPERA",
                text: "Ahora, los tulipanes se inclinan al atardecer no solo hacia el sol, sino hacia los poemas que viajan. El jardinero cuida el espacio como un altar vivo, sabiendo que cada flor que nace es un mensaje más hacia el cielo. Y en las mañanas especialmente brillantes, cuando el rocío captura la luz en forma de sonrisa, él sonríe también, porque algún día el camino de pétalos luminosos se abrirá de nuevo.",
                image: "Escena6.jpg"
            }
        ];

        let currentPage = 0;
        let totalPages = scenes.length + 2;
        let isSpeaking = false;
        let speech = null;
        let currentVoice = null;
        let isMobileView = false;
        let isFullscreenMode = false;

        document.addEventListener('DOMContentLoaded', function() {
            checkViewport();
            initBook();
            setupControls();
            loadVoices();
            setupOrientationCheck();
            
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }, 1500);
            
            window.addEventListener('resize', checkViewport);
            window.addEventListener('orientationchange', checkViewport);
        });

        function checkViewport() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isSmallScreen = window.innerWidth <= 768;
            
            isMobileView = isSmallScreen || isPortrait;
            
            if (isMobileView && !isFullscreenMode) {
                document.body.classList.add('mobile-view');
                document.body.classList.remove('fullscreen-landscape');
                showMobileControls();
            } else {
                document.body.classList.remove('mobile-view');
                if (isFullscreenMode) {
                    document.body.classList.add('fullscreen-landscape');
                }
                hideMobileControls();
            }
            
            updatePageDisplay();
            checkOrientation();
        }

        function checkOrientation() {
            const orientationNotice = document.getElementById('orientationNotice');
            const isPortrait = window.innerHeight > window.innerWidth;
            const isSmallScreen = window.innerWidth <= 768;
            
            if (isFullscreenMode && isPortrait && isSmallScreen) {
                orientationNotice.style.display = 'flex';
                setTimeout(() => {
                    if (orientationNotice.style.display === 'flex') {
                        screen.orientation.lock('landscape').catch(() => {
                            console.log('La API de orientación no está soportada');
                        });
                    }
                }, 1000);
            } else {
                orientationNotice.style.display = 'none';
            }
        }

        function setupOrientationCheck() {
            if (screen.orientation) {
                screen.orientation.addEventListener('change', checkOrientation);
            }
        }

        function showMobileControls() {
            document.getElementById('mobilePrevBtn').style.display = 'flex';
            document.getElementById('mobileNextBtn').style.display = 'flex';
        }

        function hideMobileControls() {
            document.getElementById('mobilePrevBtn').style.display = 'none';
            document.getElementById('mobileNextBtn').style.display = 'none';
        }

        function initBook() {
            renderPage();
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('mobileTotalPages').textContent = totalPages;
        }

        function updatePageDisplay() {
            renderPage();
        }

        function renderPage() {
            const bookContent = document.getElementById('bookContent');
            const book = document.getElementById('book');
            
            book.classList.add('page-turn');
            setTimeout(() => book.classList.remove('page-turn'), 800);

            let html = '';

            if (currentPage === 0) {
                if (isMobileView && !isFullscreenMode) {
                    html = `
                        <div class="single-page cover-page">
                            <div class="cover-decoration"></div>
                            <div class="cover-ornament ornament-tl">❀</div>
                            <div class="cover-ornament ornament-tr">✽</div>
                            <div class="cover-ornament ornament-bl">✾</div>
                            <div class="cover-ornament ornament-br">❁</div>
                            <h1 class="cover-title">LA PRINCESA SOLAR</h1>
                            <p class="cover-subtitle">Un cuento de jardines secretos y promesas al atardecer</p>
                            <p class="cover-author">Ilustrado con acuarelas de cerezos y tulipanes</p>
                            <div class="page-number mobile-left">Portada</div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="cover-page">
                            <div class="cover-decoration"></div>
                            <div class="cover-ornament ornament-tl">❀</div>
                            <div class="cover-ornament ornament-tr">✽</div>
                            <div class="cover-ornament ornament-bl">✾</div>
                            <div class="cover-ornament ornament-br">❁</div>
                            <h1 class="cover-title">LA PRINCESA SOLAR</h1>
                            <p class="cover-subtitle">Un cuento de jardines secretos y promesas al atardecer</p>
                            <p class="cover-author">Ilustrado con acuarelas de cerezos y tulipanes</p>
                        </div>
                    `;
                }
            } else if (currentPage === totalPages - 1) {
                if (isMobileView && !isFullscreenMode) {
                    html = `
                        <div class="single-page end-page">
                            <div class="end-title">FIN</div>
                            <div class="page-number mobile-left">Final</div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="end-page">
                            <div class="end-title">FIN</div>
                        </div>
                    `;
                }
            } else {
                const scene = scenes[currentPage - 1];
                if (isMobileView && !isFullscreenMode) {
                    html = `
                        <div class="single-page scene-page">
                            <h2 class="scene-title">${scene.title}</h2>
                            <p class="scene-text">${scene.text}</p>
                            <div class="scene-image-container">
                                <img class="scene-image" src="${scene.image}" alt="${scene.title}" 
                                     onerror="this.src='https://images.unsplash.com/photo-1541963463532-d68292c34b19?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80&txt=${scene.title}'">
                            </div>
                            <div class="page-number mobile-left">${currentPage}</div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="page page-left">
                            <h2 class="scene-title">${scene.title}</h2>
                            <p class="scene-text">${scene.text}</p>
                            <div class="page-number">${currentPage}</div>
                        </div>
                        <div class="page page-right">
                            <div class="scene-image-container">
                                <img class="scene-image" src="${scene.image}" alt="${scene.title}" 
                                     onerror="this.src='https://images.unsplash.com/photo-1541963463532-d68292c34b19?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80&txt=${scene.title}'">
                            </div>
                            <div class="page-number">${currentPage}</div>
                        </div>
                    `;
                }
            }

            bookContent.innerHTML = html;
            updateControls();
            
            if (currentPage > 0 && currentPage < totalPages - 1) {
                preloadNextImage();
            }
        }

        function updateControls() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const mobilePrevBtn = document.getElementById('mobilePrevBtn');
            const mobileNextBtn = document.getElementById('mobileNextBtn');
            const currentPageNum = document.getElementById('currentPageNum');
            const mobileCurrentPageNum = document.getElementById('mobileCurrentPageNum');
            const audioBtn = document.getElementById('audioBtn');

            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === totalPages - 1;
            mobilePrevBtn.disabled = currentPage === 0;
            mobileNextBtn.disabled = currentPage === totalPages - 1;

            let pageDisplay = '';
            if (currentPage === 0) {
                pageDisplay = 'Portada';
            } else if (currentPage === totalPages - 1) {
                pageDisplay = 'Final';
            } else {
                pageDisplay = currentPage;
            }

            currentPageNum.textContent = pageDisplay;
            mobileCurrentPageNum.textContent = pageDisplay;

            const shouldShowAudioBtn = currentPage > 0 && currentPage < totalPages - 1;
            audioBtn.style.display = shouldShowAudioBtn ? 'flex' : 'none';
            
            if (isSpeaking) {
                audioBtn.innerHTML = '<i class="fas fa-stop"></i>';
                audioBtn.classList.add('active-audio');
            } else {
                audioBtn.innerHTML = '<i class="fas fa-play"></i>';
                audioBtn.classList.remove('active-audio');
            }
            
            if (isSpeaking && (currentPage === 0 || currentPage === totalPages - 1)) {
                stopSpeech();
            }
        }

        function nextPage() {
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderPage();
                stopSpeech();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
                stopSpeech();
            }
        }

        function setupControls() {
            document.getElementById('prevBtn').addEventListener('click', prevPage);
            document.getElementById('nextBtn').addEventListener('click', nextPage);
            document.getElementById('mobilePrevBtn').addEventListener('click', prevPage);
            document.getElementById('mobileNextBtn').addEventListener('click', nextPage);
            document.getElementById('audioBtn').addEventListener('click', toggleSpeech);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

            // Navegación con teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    toggleSpeech();
                }
                if (e.key === 'Escape' && isFullscreen()) {
                    exitFullscreen();
                }
            });

            // Navegación táctil para móviles
            let touchStartX = 0;
            let touchStartY = 0;
            let touchEndX = 0;
            let touchEndY = 0;

            document.getElementById('bookContent').addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });

            document.getElementById('bookContent').addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;

                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                    if (diffX > 0) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                }
            }

            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                speechSynthesis.onvoiceschanged = () => {
                    const voices = speechSynthesis.getVoices();
                    const latinSpanishVoices = voices.filter(voice => 
                        voice.lang.startsWith('es') && 
                        (voice.name.includes('Latino') || voice.name.includes('Latin') || voice.lang.includes('419'))
                    );
                    
                    if (latinSpanishVoices.length > 0) {
                        currentVoice = latinSpanishVoices[0];
                    } else {
                        const spanishVoices = voices.filter(voice => voice.lang.startsWith('es'));
                        if (spanishVoices.length > 0) {
                            currentVoice = spanishVoices[0];
                        }
                    }
                };
                
                speechSynthesis.getVoices();
            }
        }

        function toggleSpeech() {
            if (isSpeaking) {
                stopSpeech();
            } else {
                playSceneSpeech();
            }
        }

        function playSceneSpeech() {
            if (currentPage < 1 || currentPage > scenes.length) return;

            const scene = scenes[currentPage - 1];
            const fullText = `${scene.title}. ${scene.text}`;

            if ('speechSynthesis' in window) {
                stopSpeech();

                speech = new SpeechSynthesisUtterance();
                speech.text = fullText;
                speech.lang = 'es-LA';
                speech.rate = 0.9;
                speech.pitch = 1.0;
                speech.volume = 1;

                if (currentVoice) {
                    speech.voice = currentVoice;
                }

                speech.onstart = () => {
                    isSpeaking = true;
                    document.getElementById('audioBtn').innerHTML = '<i class="fas fa-stop"></i>';
                    document.getElementById('audioBtn').classList.add('active-audio');
                };

                speech.onend = () => {
                    isSpeaking = false;
                    document.getElementById('audioBtn').innerHTML = '<i class="fas fa-play"></i>';
                    document.getElementById('audioBtn').classList.remove('active-audio');
                };

                speech.onerror = () => {
                    isSpeaking = false;
                    document.getElementById('audioBtn').innerHTML = '<i class="fas fa-play"></i>';
                    document.getElementById('audioBtn').classList.remove('active-audio');
                };

                speechSynthesis.speak(speech);
            } else {
                alert('Tu navegador no soporta la síntesis de voz. Prueba con Chrome o Edge.');
            }
        }

        function stopSpeech() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('audioBtn').innerHTML = '<i class="fas fa-play"></i>';
                document.getElementById('audioBtn').classList.remove('active-audio');
            }
        }

        function preloadNextImage() {
            const nextScene = scenes[currentPage];
            if (nextScene) {
                const img = new Image();
                img.src = nextScene.image;
            }
        }

        function toggleFullscreen() {
            if (!isFullscreen()) {
                enterFullscreen();
            } else {
                exitFullscreen();
            }
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            
            // Intentar bloquear orientación a horizontal
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    console.log('La API de orientación no está soportada');
                });
            }
            
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            // Desbloquear orientación
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
            
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        function isFullscreen() {
            return !!(document.fullscreenElement || 
                     document.webkitFullscreenElement || 
                     document.mozFullScreenElement || 
                     document.msFullscreenElement);
        }

        function handleFullscreenChange() {
            const btn = document.getElementById('fullscreenBtn');
            isFullscreenMode = isFullscreen();
            
            if (isFullscreenMode) {
                document.body.classList.add('fullscreen-landscape');
                btn.innerHTML = '<i class="fas fa-compress"></i>';
                btn.title = 'Salir de pantalla completa';
                
                // Forzar vista de escritorio en pantalla completa
                document.body.classList.remove('mobile-view');
                hideMobileControls();
                updatePageDisplay();
            } else {
                document.body.classList.remove('fullscreen-landscape');
                btn.innerHTML = '<i class="fas fa-expand"></i>';
                btn.title = 'Pantalla completa';
                
                // Restaurar vista según el viewport
                setTimeout(checkViewport, 100);
            }
            
            checkOrientation();
        }

        window.addEventListener('beforeunload', stopSpeech);
        window.addEventListener('pagehide', stopSpeech);
    </script>
